<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kuesioner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        .nav-link.active { border-bottom: 3px solid #0ea5e9; color: #0ea5e9; font-weight: 600; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

    <!-- Header & Menu Navigasi -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center">
                    <span class="text-xl font-bold text-slate-800">Portal<span class="text-sky-500">KuesionerDEI</span></span>
                </div>
                <div class="hidden sm:flex sm:space-x-8 h-full items-center">
                    <button onclick="openTab('stakeholder')" id="btn-stakeholder" class="nav-link active h-full px-1 hover:text-sky-500 transition-colors">Stakeholder Questioner</button>
                    <button onclick="openTab('students')" id="btn-students" class="nav-link h-full px-1 hover:text-sky-500 transition-colors">Students Questioner</button>
                    <button onclick="openTab('alumni')" id="btn-alumni" class="nav-link h-full px-1 hover:text-sky-500 transition-colors">Alumni Questioner</button>
                </div>
                <div class="sm:hidden flex items-center">
                    <button onclick="toggleMobileMenu()" class="text-gray-500 hover:text-gray-700 focus:outline-none p-2">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden sm:hidden bg-white border-t border-gray-100 px-2 pt-2 pb-3 space-y-1 shadow-lg">
            <button onclick="openTab('stakeholder'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-sky-600 bg-sky-50">Stakeholder Questioner</button>
            <button onclick="openTab('students'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:text-sky-600 hover:bg-gray-50">Students Questioner</button>
            <button onclick="openTab('alumni'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:text-sky-600 hover:bg-gray-50">Alumni Questioner</button>
        </div>
    </nav>

    <!-- Area Konten -->
    <main class="max-w-5xl mx-auto w-full px-2 sm:px-6 lg:px-8 py-8 flex-grow">
        
        <!-- Tab: Stakeholder -->
        <div id="stakeholder" class="tab-content active bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 pb-4 border-b border-gray-100">Stakeholder Questioner</h2>
            
            <div class="bg-gray-50 border border-gray-200 rounded-lg w-full flex justify-center">
                 <!-- width diubah jadi 100% -->
                 <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScULSFhtvoSJ5_WRrAFhpbP6pHrjkrtcEQ_zsx4zRTfVhQ3zg/viewform?embedded=true" width="100%" height="2500" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
        </div>

        <!-- Tab: Students -->
        <div id="students" class="tab-content bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 pb-4 border-b border-gray-100">Students Questioner</h2>
            
            <!-- Tempat Tabel Data (Muncul dari JavaScript) -->
            <div class="mb-8 w-full">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">Dadus Resposta:</h3>
                <div id="tempat-data" class="w-full flex items-center justify-center p-4 bg-sky-50 text-sky-600 rounded-lg border border-sky-100">
                    <span class="flex items-center gap-2">
                        <svg class="animate-spin h-5 w-5 text-sky-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        Prosesu atu hamosu dadus...
                    </span>
                </div>
            </div>

            <!-- Iframe Kuesioner (Hanya ada 1, width 100%) -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg w-full flex justify-center mt-4">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScmEZdqb0GVRcvqjXRCw0tgZdDvadAVUJxFwZ0ROTx1iH34UQ/viewform?embedded=true" width="100%" height="7197" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
           
        </div>

        <!-- Tab: Alumni -->
        <div id="alumni" class="tab-content bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 pb-4 border-b border-gray-100">Alumni Questioner</h2>
            
            <div class="bg-gray-50 border border-gray-200 rounded-lg w-full flex justify-center">
               <!-- width diubah jadi 100% -->
               <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfypIZnK_I5ksMwhF9GJeQMOmB6_M3X6RVYmNQYqZXpRp6MgA/viewform?embedded=true" width="100%" height="2500" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
        </div>

    </main>
    
    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-6 mt-auto w-full">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; DEI-FECT-UNTL 2026</p>
        </div>
    </footer>

    <!-- JavaScript Interaktif -->
    <script>
        // Logika Perpindahan Tab
        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active', 'text-sky-500'));
            document.getElementById('btn-' + tabId).classList.add('active');

            const mobileButtons = document.querySelectorAll('#mobile-menu button');
            mobileButtons.forEach(btn => {
                if (btn.textContent.toLowerCase().includes(tabId)) {
                    btn.classList.add('text-sky-600', 'bg-sky-50');
                    btn.classList.remove('text-gray-600', 'hover:bg-gray-50');
                } else {
                    btn.classList.remove('text-sky-600', 'bg-sky-50');
                    btn.classList.add('text-gray-600', 'hover:bg-gray-50');
                }
            });
        }

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        // ==========================================
        // SCRIPT AMBIL DATA DARI GOOGLE SHEET
        // ==========================================
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwhnEnkNQY3KdAqzv97K_KJD2eRwWc_GVM8iR4e-l0NGLZ1quLwwfwJvWY5fNDWReBV/exec';

        fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                document.getElementById('tempat-data').innerHTML = `
                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-center border-collapse border border-gray-400 text-sm md:text-base bg-white">
                            <thead>
                                <tr class="bg-gray-200">
                                    <th rowspan="2" class="border border-gray-400 p-2 font-semibold">Numeru-Responden</th>
                                    <th colspan="2" class="border border-gray-400 p-2 font-semibold">Sexu</th>
                                    <th colspan="3" class="border border-gray-400 p-2 font-semibold">Tinan</th>
                                </tr>
                                <tr class="bg-gray-100">
                                    <th class="border border-gray-400 p-2">M</th>
                                    <th class="border border-gray-400 p-2">F</th>
                                    <th class="border border-gray-400 p-2">18-24</th>
                                    <th class="border border-gray-400 p-2">25-30</th>
                                    <th class="border border-gray-400 p-2">31-40</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="bg-white">
                                    <td class="border border-gray-400 p-2 font-bold text-sky-600">${data.estudantes || 0}</td>
                                    <td class="border border-gray-400 p-2">${data.sexuM || 0}</td>
                                    <td class="border border-gray-400 p-2">${data.sexuF || 0}</td>
                                    <td class="border border-gray-400 p-2">${data.tinan1824 || 0}</td>
                                    <td class="border border-gray-400 p-2">${data.tinan2530 || 0}</td>
                                    <td class="border border-gray-400 p-2">${data.tinan3140 || 0}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            })
            .catch(error => {
                console.error('Error!', error.message);
                document.getElementById('tempat-data').innerHTML = "<span class='text-red-500'>Gagal memuat data.</span>";
            });
    </script>
</body>
</html>
